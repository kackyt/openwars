[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = "0.15.2"
uuid = { version = "1.12", features = ["v4", "js", "serde"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
thiserror = "2.0"
anyhow = "1.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"
wasm-bindgen-futures = "0.4.42"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
