[project]
name = "openwars-eval"
version = "0.1.0"
description = "AI Matchup Evaluator for OpenWars"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
openwars-eval = "scripts.eval_matchup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
